services:
  app:
    build: .
    container_name: outlook-spam-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/data
      - tunnel-info:/shared

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: outlook-spam-bot-tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # --- Quick tunnel alternative (no domain needed, URL changes on restart) ---
    # If you ever want to switch back, replace the image/command/environment
    # above with the custom build instead:
    #   build:
    #     context: .
    #     dockerfile: Dockerfile.cloudflared
    #   volumes:
    #     - tunnel-info:/shared
    # and unset NOTIFICATION_URL in .env so app.py auto-detects it again.
 
volumes:
  bot-data:
  tunnel-info: